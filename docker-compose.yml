services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: oneagent-postgres
    environment:
      POSTGRES_DB: oneagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - /Users/liu_y/Documents/vol/oneAgent/db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oneagent-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oneagent-backend
    environment:
      PORT: "8080"
      MEMORYSDK_POSTGRES_DSN: postgres://postgres:postgres123@postgres:5432/oneagent?sslmode=disable
      MEMORYSDK_PRE_RECALL_POLICY: auto
      MEMORYSDK_ENABLE_TOOLS: ${MEMORYSDK_ENABLE_TOOLS:-1}
      MEMORYSDK_ENABLE_TURN_END_JOBS: ${MEMORYSDK_ENABLE_TURN_END_JOBS:-0}
      BASH_ROOT_DIR: /data/bash-root

      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak.i.strategylab.xyz:10003}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-homeService}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-client_id_localhost_test}
      KEYCLOAK_CLIENT_SECRET: BIPkoFGoxJPllxX3aRICLywltEQTjj2H
      KEYCLOAK_REDIRECT_URL: ${KEYCLOAK_REDIRECT_URL:-http://localhost:20001/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-oneagent-jwt-secret-change-in-production}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}

      ENABLE_TRACE: "true"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - /Users/liu_y/Documents/vol/oneAgent/data:/data
    ports:
      - "20001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oneagent-network




networks:
  oneagent-network:
    driver: bridge
