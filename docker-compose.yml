version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: oneagent-postgres
    environment:
      POSTGRES_DB: oneagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oneagent-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oneagent-backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres123@postgres:5432/oneagent?sslmode=disable

      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://keycloak.i.strategylab.xyz:10003}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-homeService}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-client_id_localhost_test}
      KEYCLOAK_CLIENT_SECRET: BIPkoFGoxJPllxX3aRICLywltEQTjj2H
      KEYCLOAK_REDIRECT_URL: ${KEYCLOAK_REDIRECT_URL:-http://localhost:20001/auth/callback}
      JWT_SECRET: ${JWT_SECRET:-oneagent-jwt-secret-change-in-production}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS:-7}

      ENABLE_TRACE: "true"
    ports:
      - "20001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oneagent-network

volumes:
  postgres_data:


networks:
  oneagent-network:
    driver: bridge
